<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Сипсик Love</title>
<meta name="theme-color" content="#1f1d38">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: navy header band with dripping edge on every screen, white body of outlined cards, floating navy tab bar. One deliberate light look (navy, white, peach). */
:root{
  color-scheme:light;
  --navy:#1f1d38;--navy-2:#34315a;--paper:#ffffff;--mist:#f2f1f7;--grey:#8b89a1;
  --peach:#f8a878;--peach-soft:#fde5d4;--peach-ink:#7a3a12;--sky:#7cc7f2;
  --brand:"Montserrat",system-ui,sans-serif;
  --body:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bw:2px;--r:20px;
}
*{box-sizing:border-box}
html,body{background:var(--paper)}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{-webkit-font-smoothing:antialiased;color:var(--navy);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--peach);outline-offset:2px}
p{margin:0}
h1,h2{margin:0;text-wrap:balance}
h1{font-family:var(--brand);font-weight:800;font-size:22px;color:var(--paper);text-align:center}
h2{font-weight:800;font-size:16px}

/* band */
.band{color:var(--paper);background:linear-gradient(var(--navy),var(--navy)) top/100% calc(100% - 45px) no-repeat}
.bandin{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 4px;display:flex;flex-direction:column;gap:14px}
.drip{display:block;width:100%;height:46px;margin-top:-1px;margin-bottom:10px}
.app{position:relative;z-index:1}
.drip path,.drip circle{fill:var(--navy)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--brand);font-weight:800;font-size:19px;display:flex;align-items:center;gap:8px}
.brand .face{width:34px;height:34px;border-radius:50%;background:var(--paper);padding:2px}
.brand em{font-style:normal;color:var(--peach)}
.iconbtn{width:40px;height:40px;border-radius:50%;border:var(--bw) solid currentColor;background:none;display:grid;place-items:center;color:inherit;padding:0}
.iconbtn svg{width:19px;height:19px}

.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:2px calc(112px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--paper);border:var(--bw) solid var(--navy);border-radius:var(--r);padding:16px;min-width:0}
.card.dark{background:var(--navy);color:var(--paper)}
.muted{color:var(--grey)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--grey);border:1.5px dashed var(--grey);border-radius:99px;padding:1px 7px;vertical-align:middle}

/* buttons & pills */
.btn{border:var(--bw) solid var(--navy);border-radius:99px;padding:11px 18px;font-weight:700;background:var(--paper);color:var(--navy)}
.btn.navy{background:var(--navy);color:var(--paper)}
.btn.peach{background:var(--peach);border-color:var(--peach);color:var(--navy)}
.btn.block{width:100%}
.linkbtn{border:0;background:none;padding:6px 0;color:var(--peach-ink);font-weight:700;font-size:13px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:var(--bw) solid var(--navy);background:var(--paper);border-radius:99px;padding:7px 14px;font-weight:700;font-size:14px}
.pill[aria-pressed="true"]{background:var(--navy);color:var(--paper)}
.band .pill{border-color:var(--paper);background:none;color:var(--paper)}
.band .pill[aria-pressed="true"]{background:var(--paper);color:var(--navy)}
.band .pills{justify-content:center}

/* fields */
input[type=text],input[type=date],input[type=time],input[type=url],select,textarea{width:100%;min-width:0;border:var(--bw) solid var(--navy);background:var(--paper);border-radius:99px;padding:11px 16px;outline:none}
textarea{border-radius:18px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--grey)}
input:focus,select:focus,textarea:focus{border-color:var(--peach)}
.form{display:flex;flex-direction:column;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.addrow{display:flex;gap:8px}
.addrow input{flex:1}
.addrow .btn{flex:none}

/* us band */
.stage{position:relative;display:block;width:100%;max-width:100%;aspect-ratio:300/215;border:0;padding:0;border-radius:36px 36px 36px 36px;background:var(--paper);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.stage svg{width:100%;height:100%;display:block}
.stage .catbody{transform-origin:150px 208px}
.stage .breath{transform-origin:150px 208px;animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.018,.984)}}
.stage .lids ellipse{transform-box:fill-box;transform-origin:center;transform:scaleY(0);animation:blink 5.4s infinite}
.stage .lids ellipse:last-child{animation-delay:.03s}
@keyframes blink{0%,91%,100%{transform:scaleY(0)}94%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.stage.boop .catbody{animation:boop .2s ease-out}
@keyframes boop{0%{transform:scale(1,1)}40%{transform:scale(1.05,.93)}100%{transform:scale(1,1)}}
.plus{position:absolute;font-weight:800;color:var(--peach);pointer-events:none;animation:rise .7s ease-out forwards;font-size:17px;-webkit-text-stroke:.5px var(--navy)}
@keyframes rise{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-46px)}}
.namepill{align-self:center;margin-top:-34px;position:relative;background:var(--navy);color:var(--paper);border:3px solid var(--paper);border-radius:99px;padding:8px 20px;font-weight:700;display:flex;gap:10px;align-items:baseline}
.namepill b{font-variant-numeric:tabular-nums;color:var(--peach)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:var(--bw) solid var(--navy);border-radius:18px;padding:9px 6px;text-align:center;min-width:0}
.stat b{display:block;font-size:20px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--grey);font-weight:600}
.stat.hl{background:var(--peach);border-color:var(--peach)}
.stat.hl span{color:var(--navy)}

.bar{height:10px;border-radius:99px;border:var(--bw) solid var(--navy);overflow:hidden;background:var(--paper)}
.bar i{display:block;height:100%;background:var(--peach);transition:width .25s}
.nextline{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;margin-bottom:6px}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.item{border:var(--bw) solid var(--navy);background:var(--paper);border-radius:18px;padding:8px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-width:0}
.item svg{width:100%;height:38px}
.item b{font-size:12px;line-height:1.2}
.item span{font-size:11px;color:var(--grey);font-weight:600;font-variant-numeric:tabular-nums}
.item.on{background:var(--peach);border-color:var(--peach)}
.item.on span{color:var(--navy)}
.item.locked{border-style:dashed;border-color:var(--grey)}
.item.locked svg{filter:grayscale(1);opacity:.3}
.item.locked b{color:var(--grey)}

.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:12px}
.mood{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:700;min-width:0}
.mood .face{width:56px;height:56px;border-radius:50%;border:var(--bw) solid var(--navy);padding:4px;background:var(--paper)}
.mood[aria-pressed="true"] .face{background:var(--peach);border-color:var(--peach)}
.face svg{width:100%;height:100%;display:block}
.partner{margin-top:14px;display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.partner .face{width:30px;height:30px;flex:none}

.soon{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;border:var(--bw) solid var(--navy);border-radius:99px;padding:9px 16px;min-width:0}
.prow.fill{background:var(--peach);border-color:var(--peach)}
.prow .t{font-weight:700;min-width:0;overflow-wrap:anywhere}
.prow .r{font-size:12px;font-weight:700;flex:none;font-variant-numeric:tabular-nums}

/* lists */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1.5px solid var(--mist);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.li .sub{font-size:12px;color:var(--grey);font-weight:600}
.check{flex:none;width:28px;height:28px;border-radius:50%;border:var(--bw) solid var(--navy);background:none;display:grid;place-items:center;padding:0}
.check svg{width:14px;height:14px;opacity:0}
.check[aria-pressed="true"]{background:var(--peach);border-color:var(--peach)}
.check[aria-pressed="true"] svg{opacity:1}
.li.done .grow>.t{text-decoration:line-through;color:var(--grey)}
.x{flex:none;border:0;background:none;color:var(--grey);width:30px;height:30px;border-radius:50%;font-size:20px;line-height:1;padding:0}
.who{flex:none;border:var(--bw) solid var(--navy);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:800;background:var(--paper)}
.who.p{background:var(--navy);color:var(--paper)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.chip{border:1.5px solid var(--navy);background:var(--paper);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
.split div{border:var(--bw) solid var(--navy);border-radius:18px;padding:10px 14px}
.split div:last-child{background:var(--navy);color:var(--paper)}
.split b{font-size:22px;font-weight:800;display:block;font-variant-numeric:tabular-nums}
.split span{font-size:12px;font-weight:600;opacity:.75}

.notes{margin-top:12px}
.st{display:inline-block;font-size:11px;font-weight:800;border-radius:99px;padding:2px 9px}
.st.wait{border:1.5px solid var(--navy)}
.st.ok{background:var(--peach)}
.empty{text-align:center;color:var(--grey);padding:18px 8px;font-size:14px;font-weight:600}

/* wishlist */
.lockline{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:600;color:var(--grey);background:var(--mist);border-radius:99px;padding:9px 14px}
.lockline svg{width:15px;height:15px;flex:none}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wish{border:var(--bw) solid var(--navy);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;min-width:0;background:var(--paper)}
.wish.got{opacity:.5}
.wish.res{border-color:var(--peach);box-shadow:0 0 0 2px var(--peach)}
.photo{position:relative;display:block;aspect-ratio:1;max-width:100%;background:var(--mist);border-bottom:var(--bw) solid var(--navy);cursor:pointer;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block;color:transparent;font-size:0}
.photo .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:700;color:var(--grey)}
.photo .ph .face{width:54px;height:54px;opacity:.9}
.photo input{position:absolute;width:1px;height:1px;opacity:0}
.photo .badge{position:absolute;top:8px;left:8px;background:var(--peach);color:var(--navy);font-size:11px;font-weight:800;border-radius:99px;padding:3px 9px}
.wbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.wbody .t{font-weight:800;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.wbody .note{font-size:12px;color:var(--grey);overflow-wrap:anywhere}
.price{align-self:flex-start;font-size:12px;font-weight:800;background:var(--navy);color:var(--paper);border-radius:99px;padding:3px 10px}
a.ext{color:var(--peach-ink);font-weight:700;font-size:12px}
.wacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.mini{border:1.5px solid var(--navy);background:var(--paper);border-radius:99px;padding:5px 10px;font-size:12px;font-weight:700}
.mini.peach{background:var(--peach);border-color:var(--peach)}
.mini.navy{background:var(--navy);color:var(--paper)}
.photopick{display:flex;align-items:center;gap:12px;border:var(--bw) dashed var(--navy);border-radius:18px;padding:10px;cursor:pointer;position:relative}
.photopick input{position:absolute;width:1px;height:1px;opacity:0}
.photopick .thumb{width:64px;height:64px;border-radius:14px;background:var(--mist);flex:none;overflow:hidden;display:grid;place-items:center;font-size:26px;font-weight:300;color:var(--grey)}
.photopick .thumb img{width:100%;height:100%;object-fit:cover}
.photopick b{display:block;font-size:14px}
.photopick span{font-size:12px;color:var(--grey);font-weight:600}

/* calendar */
.calhead{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:10px}
.calhead b{font-weight:800;font-size:17px;min-width:9ch;text-align:center}
.calhead .iconbtn{width:34px;height:34px;border-width:0;font-size:22px;font-weight:700}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.grid7 .wd{font-size:12px;font-weight:700;color:var(--grey);padding:2px 0}
.day{position:relative;border:var(--bw) solid var(--navy);background:var(--paper);border-radius:50%;aspect-ratio:1;display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:13px;padding:0;min-width:0}
.day.out{border-color:var(--mist);color:var(--grey)}
.day.plan{background:var(--peach);border-color:var(--peach)}
.day.bd::after{content:"";position:absolute;top:-2px;right:-2px;width:9px;height:9px;border-radius:50%;background:var(--navy);border:2px solid var(--paper)}
.day.today{box-shadow:0 0 0 3px var(--peach-soft)}
.day[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--paper)}
.legend{display:flex;gap:14px;justify-content:center;margin-top:12px;font-size:12px;font-weight:600;color:var(--grey)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.bdico{flex:none;width:38px;height:38px;border-radius:50%;background:var(--navy);color:var(--paper);display:grid;place-items:center;font-weight:800;font-size:13px}

/* roulette */
.slot{min-height:110px;display:grid;place-items:center;border-radius:28px;background:var(--paper);color:var(--navy);padding:14px;text-align:center}
.slot b{font-family:var(--brand);font-size:23px;line-height:1.2;overflow-wrap:anywhere;text-wrap:balance}
.slot.spinning b{opacity:.6}
.slot.hit{background:var(--peach)}
.rouacts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rouacts .btn{border-color:var(--paper)}
.rouacts .btn.ghost{background:none;color:var(--paper)}

/* nav */
.nav{position:fixed;z-index:20;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:496px;margin:0 auto;background:var(--navy);border-radius:28px;padding:6px 6px}
.nav .in{display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:none;color:var(--paper);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:10.5px;font-weight:700;min-width:0;opacity:.72}
.nav .ic{width:42px;height:34px;border-radius:99px;display:grid;place-items:center}
.nav svg{width:22px;height:22px}
.nav button[aria-current="page"]{opacity:1}
.nav button[aria-current="page"] .ic{background:var(--peach);color:var(--navy)}

/* sheet + toast */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(31,29,56,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;background:var(--paper);border-radius:28px 28px 0 0;padding:22px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-height:90%;overflow:auto}
.sheet label{font-size:12px;font-weight:700;color:var(--grey);display:flex;flex-direction:column;gap:5px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--peach);color:var(--navy);border:var(--bw) solid var(--navy);padding:10px 18px;border-radius:99px;font-weight:800;font-size:14px;width:max-content;max-width:calc(100% - 32px);text-align:center;animation:pop .2s ease-out}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* real app additions */
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;min-height:46px;text-align:left;background:var(--paper)}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left}
.sheet,.sheet *{min-width:0}
.sheet label{width:100%}
.sheet label.toggle{flex-direction:row;align-items:center;gap:12px;font-size:14px;color:var(--navy);font-weight:600;cursor:pointer}
.toggle input{-webkit-appearance:none;appearance:none;flex:none;width:48px;height:28px;border-radius:99px;background:var(--mist);border:var(--bw) solid var(--navy);position:relative;cursor:pointer;margin:0}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--navy);transition:transform .15s}
.toggle input:checked{background:var(--peach);border-color:var(--navy)}
.toggle input:checked::after{transform:translateX(20px)}
.app.nonav{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
body.busy{cursor:progress}
body.busy [data-act]{pointer-events:none}
body.busy .stage,body.busy .nav button{pointer-events:auto}
.lbl{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--grey)}
.invite{background:var(--navy);color:var(--paper);display:flex;flex-direction:column;gap:10px}
.invite .code{background:var(--navy-2);border-radius:14px;padding:10px 12px;font-size:13px;font-weight:600;overflow-wrap:anywhere;user-select:all;-webkit-user-select:all}
.btn.ghostw{background:none;color:var(--paper);border-color:var(--paper)}
.prow.onnavy{border-color:var(--paper)}
.prow.fill{color:var(--navy)}
.prow.navyrow{background:var(--navy);border-color:var(--navy);color:var(--paper)}
.who:disabled{opacity:1}
.say{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--paper);color:var(--navy);border:var(--bw) solid var(--navy);border-radius:16px;padding:7px 12px;font-size:13px;font-weight:800;white-space:nowrap;box-shadow:0 4px 0 rgba(31,29,56,.12);pointer-events:none}
.say::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--paper);border-right:var(--bw) solid var(--navy);border-bottom:var(--bw) solid var(--navy);transform:translateX(-50%) rotate(45deg)}
.say.wiggle{animation:wiggle .4s ease-in-out}
@keyframes wiggle{25%{transform:translateX(-52%) rotate(-3deg)}75%{transform:translateX(-48%) rotate(3deg)}}
.coats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.coat{border:var(--bw) solid var(--navy);background:var(--paper);border-radius:18px;padding:8px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.coat .face{width:58px;height:58px}
.coat b{font-size:12px;line-height:1.2}
.coat .cp{font-size:11px;font-weight:700;color:var(--grey)}
.coat.on{background:var(--peach);border-color:var(--peach)}
.coat.on .cp{color:var(--navy)}
.coatprev{background:var(--peach-soft);border-radius:24px;padding:10px}
.coatprev svg{width:100%;height:auto;display:block}
.thankp{background:#fff6d9;border-color:#e9c560}
.thanks{display:flex;flex-direction:column;gap:8px}

async function api(action, payload, opts) {
  const r = await fetch(API_URL, {
    method:'POST', keepalive: !!(opts && opts.keepalive),
    headers:{'content-type':'application/json','x-init-data':tg.initData},
    body: JSON.stringify(Object.assign({action, day: today()}, payload || {}))
  });
  let data = null;
  try { data = await r.json(); } catch (_) {}
  if (!data) throw new Error('Сервер не ответил. Проверь интернет и попробуй ещё раз');
  if (!r.ok || data.error) throw new Error(data.error || 'Ошибка сервера');
  return data;
}
// Блокирующее действие: ждём сервер (создание пары, фото, настройки)
async function act(action, payload, okMsg) {
  if (ui.busy) return false;
  ui.busy = true; document.body.classList.add('busy');
  try {
    await queue;
    const st = await api(action, payload);
    S = st; render();
    if (okMsg) toast(okMsg);
    return true;
  } catch (e) { toast(e.message); haptic('error'); return false; }
  finally { ui.busy = false; document.body.classList.remove('busy'); }
}
// Мгновенное действие: сразу меняем экран, сервер догоняет в фоне по очереди
function mutate(action, payload, apply, okMsg) {
  if (apply) { try { apply(S); } catch (_) {} render(); }
  if (okMsg) toast(okMsg);
  pendingOps++;
  queue = queue.then(async () => {
    try {
      const st = await api(action, payload);
      if (pendingOps === 1 && st && st.me) { S = st; renderSoft(); }
    } catch (e) {
      toast(e.message); haptic('error');
      try { if (pendingOps === 1) { S = await api('state'); renderSoft(); } } catch (_) {}
    } finally { pendingOps--; }
  });
}

const isTmp = id => String(id).startsWith('tmp');

function typing() { const a = document.activeElement; return !!(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)); }

  if (ui.view !== 'app' || ui.busy || pendingOps || pendingTaps || tapInFlight) return;

    const st = await api('state');

}

  if (document.visibilityState !== 'visible' || ui.view !== 'app' || !S || !S.couple) return;

const tiredNow = () => (S.couple.taps_today || 0) >= tapCap();
function queueTap() {
  pendingTaps++; S.couple.clicks++; S.couple.taps_today = (S.couple.taps_today || 0) + 1;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(flushTaps, pendingTaps >= 250 ? 0 : 900);
}
async function flushTaps(keepalive) {
  if (!pendingTaps || tapInFlight) return;
  const n = Math.min(pendingTaps, 300); pendingTaps -= n; tapInFlight = true;
  try {
    const res = await api('tap', {n}, {keepalive});
    const wasTired = tiredNow();
    if (res.capped) { pendingTaps = 0; S.couple.clicks = res.clicks; S.couple.taps_today = res.today; }
    else { S.couple.clicks = res.clicks + pendingTaps; S.couple.taps_today = (res.today || 0) + pendingTaps; }
    S.couple.worn = res.worn;
    if (tiredNow() !== wasTired && tab === 'us') render();
    if (res.unlocked && res.unlocked.length) {
      haptic('heavy');
      if (tab === 'us') render();
      toast(pet() + ' получил: ' + res.unlocked.map(id => ITEMS.find(i => i.id === id).n).join(', ') + '!');
    } else updateTapUI();
  } catch (e) {
    S.couple.clicks -= n; S.couple.taps_today = Math.max(0, (S.couple.taps_today || 0) - n); updateTapUI(); toast(e.message);
  } finally {
    tapInFlight = false;
    if (pendingTaps) tapTimer = setTimeout(flushTaps, 300);
  }
}

}

  const fact = val('tFact').replace(/[.!]+$/, ''), ask = val('tAsk').replace(/[.!]+$/, '');
  const parts = [];
  if (fact) parts.push('Когда ' + low(fact) + (ui.feel.length ? ', я чувствую ' + join(ui.feel) : '') + '.');
  else if (ui.feel.length) parts.push('Я чувствую ' + join(ui.feel) + '.');
  if (ui.need.length) parts.push('Для меня важно: ' + join(ui.need) + '.');
  if (ask) parts.push('Моя просьба: ' + low(ask) + '.');
  return parts.join(' ');
}

  const together = diff(start, t);
  const next100 = (Math.floor(together / 100) + 1) * 100;
  items.push({auto: true, ico: '💯', title: next100 + ' дней вместе', next: addDays(start, next100)});
  const annY = pd(t).getFullYear() - pd(start).getFullYear();
  let ann = (pd(t).getFullYear()) + start.slice(4); let years = annY;
  if (ann < t) { ann = (pd(t).getFullYear() + 1) + start.slice(4); years++; }
  if (years > 0) items.push({auto: true, ico: '🎉', title: years + '-я годовщина', next: ann});
  for (const x of (S.dates || [])) {
    let next = x.day, past = false;
    if (x.yearly) next = nextOcc(x.day); else past = x.day < t;
    const n = x.yearly ? +next.slice(0, 4) - +x.day.slice(0, 4) : 0;
    items.push({id: x.id, ico: '💗', title: x.title + (x.yearly && n > 0 ? ` · ${n} ${plural(n, ['год','года','лет'])}` : ''), next, past});
  }
  items.sort((a, b) => (a.past - b.past) || a.next.localeCompare(b.next));
  return `<section class="card">
    <h2>Важные даты</h2>
    <p class="small muted" style="margin-top:2px">Бот напомнит вам обоим за 3 дня и в сам день</p>
    <ul class="list datelist" style="margin-top:6px">${items.map(x => {
      const k = diff(t, x.next);
      return `<li class="li"><span class="heartico">${x.ico}</span><div class="grow"><span class="t" style="font-weight:700">${esc(x.title)}</span><div class="sub">${fmt(x.next)}</div></div>
      <span class="when">${x.past ? 'было' : k === 0 ? '<b>сегодня</b>' : `<b>${k}</b>${plural(k, DAYS)}`}</span>
      ${x.auto ? '' : `<button class="x" data-act="datedel" data-id="${x.id}" aria-label="Удалить">×</button>`}</li>`;
    }).join('')}</ul>
    <div class="form" style="margin-top:10px">
      <input type="text" id="dT" placeholder="Например, первое свидание" maxlength="80">
      <div class="two">${dateField('dD', 'Дата')}<button class="btn navy" data-act="dateadd">Добавить</button></div>
      <label class="toggle small"><input type="checkbox" id="dY" checked><span>Повторять каждый год</span></label>
    </div>
  </section>`;
}

function shrink(img, max, q) {
  const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}

function spin() {
  if (ui.spinning || S.places.length < 2) return;
  ui.spinning = true; const names = S.places.map(p => p.title);
  let final; do { final = names[Math.floor(Math.random() * names.length)]; } while (final === ui.spin);
  ui.spin = null; render();
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let delay = 50, elapsed = 0, i = Math.floor(Math.random() * names.length);
  const tick = () => {
    const el = document.getElementById('slotTxt'); if (!el) { ui.spinning = false; ui.spin = final; return; }
    i = (i + 1) % names.length; el.textContent = names[i]; elapsed += delay; delay *= 1.12; haptic('light');
    if (elapsed < 1900 && !reduce) setTimeout(tick, delay); else { ui.spinning = false; ui.spin = final; render(); haptic('heavy'); }
  }; tick();

      const p = S.sos && S.sos.partner; if (!p) return;
      const r = id || val('sosText'); if (!r) { toast('Выбери ответ или напиши своё'); return; }
      haptic('success'); mutate('sos.reply', {id: p.id, reply: r}, s => { s.sos.partner.reply = r; }, 'Ответ отправлен 💜'); return;
    }
    case 'sosok': mutate('sos.resolve', {id}, s => { s.sos.mine = null; }, 'Рады, что тебе лучше 🌤'); return;
    case 'breathe': openBreath(); return;
    case 'coat': {
      const c = (S.coats || []).find(x => x.id === id); if (!c) return;
      const has = (S.couple.owned || []).includes(id) || !c.price;
      if (has) { if (S.couple.coat !== id) { haptic('medium'); mutate('coat.set', {coat: id}, s => { s.couple.coat = id; }); } return; }
      openCoatSheet(id); return;
    }
    case 'buy': {
      if (!tg.openInvoice) { toast('Обнови Telegram, чтобы покупать за звёзды'); return; }
      b.disabled = true; b.textContent = 'Открываем оплату…';
      try {
        const r = await api('buy', {coat: id});
        closeSheet();
        tg.openInvoice(r.link, status => {
          if (status === 'paid') { toast(COATS[id] && COATS[id].animal ? 'Оплата прошла! ' + pet() + ' превращается…' : 'Оплата прошла! Красим ' + pet() + '…'); waitCoat(id); }
          else if (status === 'failed') toast('Оплата не прошла. Попробуй ещё раз');
        });
      } catch (err) { toast(err.message); b.disabled = false; b.textContent = 'Попробовать ещё раз'; }
      return;
    }
    case 'thchip': { const f = document.getElementById('thText'); if (f) { f.value = (f.value ? f.value.trim() + ' ' : '') + id; f.focus(); } return; }
    case 'thadd': { const t = val('thText'); if (!t) { toast('Напиши, за что спасибо'); return; } haptic('success');
      mutate('thanks.add', {body: t}, s => { (s.thanks = s.thanks || []).unshift({id: tmpId(), who: 'me', body: t, hearted: false, created_at: new Date().toISOString()}); }, solo() ? 'Записано в дневник 💛' : 'Спасибо отправлено 💛'); return; }
    case 'thheart': if (busyTmp(id)) return; haptic('light'); mutate('thanks.heart', {id}, s => { const x = s.thanks.find(y => y.id === id); x.hearted = !x.hearted; }); return;
    case 'thdelarm': ui.thDel = id; render(); return;
    case 'thdel': if (busyTmp(id)) return; ui.thDel = null; mutate('thanks.delete', {id}, s => { s.thanks = s.thanks.filter(x => x.id !== id); }); return;
    case 'talkopen': openTalkSheet(); return;
    case 'talkchip': { const k = b.dataset.kind, arr = ui[k]; const on = arr.includes(id); if (on) arr.splice(arr.indexOf(id), 1); else arr.push(id); b.setAttribute('aria-pressed', String(!on)); return; }
    case 'talkbuild': { const txt = buildTalk(); if (!txt) { toast('Заполни хотя бы один шаг'); return; } document.getElementById('tResWrap').hidden = false; const r = document.getElementById('tRes'); r.value = txt; r.scrollIntoView({behavior: 'smooth', block: 'center'}); return; }
    case 'talkai': {
      const r = document.getElementById('tRes'); const src = (r && r.value.trim()) || buildTalk(); if (!src) { toast('Сначала заполни шаги'); return; }
      b.disabled = true; const old = b.textContent; b.textContent = 'ИИ думает…';
      try { const res = await api('nvc.rewrite', {text: src}); r.value = res.text; toast('Готово ✨ Проверь и поправь, если нужно'); }
      catch (err) { toast(err.message); } finally { b.disabled = false; b.textContent = old; }
      return;
    }
    case 'talksend': {
      let txt = (document.getElementById('tRes') || {}).value; txt = (txt || '').trim() || buildTalk();
      if (!txt) { toast('Заполни хотя бы один шаг'); return; }
      closeSheet(); haptic('success'); act('talk.send', {body: txt}, 'Сообщение отправлено бережно 🕊'); return;
    }
    case 'talkreply': { const p = S.talk && S.talk.partner; if (!p) return; const r = id || val('talkText'); if (!r) { toast('Выбери ответ или напиши своё'); return; }
      mutate('talk.reply', {id: p.id, reply: r}, s => { s.talk.partner.reply = r; }, 'Ответ отправлен 🕊'); return; }
    case 'talkclose': mutate('talk.close', {id}, s => { s.talk.mine = null; }, 'Рады, что вы поговорили 💜'); return;
    case 'qwish': tab = 'wish'; ui.who = 'me'; ui.wishForm = true; ui.draftPhoto = null; render(); scrollTo(0, 0); setTimeout(() => { const f = document.getElementById('wT'); f && f.focus(); }, 60); return;
    case 'qshop': openShopSheet(); return;
    case 'qplan': tab = 'cal'; ui.sel = today(); ui.calM = today().slice(0, 7); render(); scrollTo(0, 0);
      setTimeout(() => { const c = document.getElementById('dayCard'); c && c.scrollIntoView({behavior: 'smooth', block: 'center'}); const f = document.getElementById('plT'); f && f.focus({preventScroll: true}); }, 60); return;
    case 'wear': {
      const on = !S.couple.worn[id], it = ITEM_BY[id];
      mutate('wear', {item: id, on}, s => { if (on && it) ITEMS.forEach(x => { if (x.slot === it.slot) s.couple.worn[x.id] = false; }); s.couple.worn[id] = on; });
      return;
    }
    case 'allitems': ui.allItems = !ui.allItems; render(); return;
    case 'mood': haptic('medium'); mutate('mood', {mood: id}, s => { s.moods.me = id; }); return;
    case 'note': {
      const t = val('noteText'); if (!t) { toast('Напиши текст записки'); return; }
      mutate('note.send', {body: t}, s => s.notes.sent.unshift({id: tmpId(), body: t, delivered_at: null, created_at: new Date().toISOString()}), 'Записка улетела. Придёт неожиданно 💌');
      const f = document.getElementById('noteText'); if (f) f.value = '';
      return;
    }
    case 'delnote': if (busyTmp(id)) return; mutate('note.delete', {id}, s => { s.notes.sent = s.notes.sent.filter(n => n.id !== id); }, 'Записка отменена'); return;
    case 'who': ui.who = id; ui.wishForm = false; ui.draftPhoto = null; render(); return;
    case 'wishform': ui.wishForm = true; ui.draftPhoto = null; render(); document.getElementById('wT').focus(); return;
    case 'wishcancel': ui.wishForm = false; ui.draftPhoto = null; render(); return;
    case 'wishadd': {
      const t = val('wT'); if (!t) { toast('Напиши, что хочется'); return; }
      const draft = ui.draftPhoto, payload = {owner: ui.who, title: t, price: val('wP'), link: val('wL'), note: val('wN')};
      ui.wishForm = false; ui.draftPhoto = null;
      if (draft) {
        toast('Сохраняем вместе с фото…');
        const ok = await act('wish.add', Object.assign(payload, {photo: draft.full, thumb: draft.thumb}), 'Желание добавлено');
        if (!ok) { ui.wishForm = true; ui.draftPhoto = draft; render(); }
      } else {
        mutate('wish.add', payload, s => s.wishes.unshift({id: tmpId(), owner: ui.who, title: t, price: payload.price, link: payload.link, note: payload.note, photo_url: null, thumb_url: null, done: false, reserved_by_me: false}), 'Желание добавлено');
      }
      return;
    }
    case 'wishres': { if (busyTmp(id)) return; const w = byId(S.wishes, id); mutate('wish.reserve', {id}, s => { const x = byId(s.wishes, id); x.reserved_by_me = !x.reserved_by_me; }, w && w.reserved_by_me ? 'Отметка снята' : 'Отмечено: даришь ты 🎁'); return; }
    case 'wishgot': if (busyTmp(id)) return; mutate('wish.done', {id}, s => { byId(s.wishes, id).done = true; }, 'Ура, сбылось ✨'); return;
    case 'wishdelarm': ui.delArm = id; render(); return;
    case 'wishdel': if (busyTmp(id)) return; ui.delArm = null; mutate('wish.delete', {id}, s => { s.wishes = s.wishes.filter(w => w.id !== id); }, 'Желание удалено'); return;
    case 'homeseg': ui.home = id; render(); return;
    case 'shopadd': { const f = document.getElementById(id || 'shopIn'); const t = f ? f.value.trim() : ''; if (!t) return; addShop(t); const g = document.getElementById(id || 'shopIn'); if (g) { g.value = ''; g.focus(); } return; }
    case 'quick': addShop(id); return;
    case 'shoptoggle': if (busyTmp(id)) return; mutate('shop.toggle', {id}, s => { const x = byId(s.shop, id); x.done = !x.done; }); return;
    case 'shopdel': if (busyTmp(id)) return; mutate('shop.delete', {id}, s => { s.shop = s.shop.filter(x => x.id !== id); }); return;
    case 'shopclear': mutate('shop.clear', {}, s => { s.shop = s.shop.filter(x => !x.done); }); return;
    case 'choretoggle': if (busyTmp(id)) return; mutate('chore.toggle', {id}, s => { const c = byId(s.chores, id); c.done_on = c.done_on === today() ? null : today(); }); return;
    case 'choreswap': if (busyTmp(id)) return; mutate('chore.swap', {id}, s => { const c = byId(s.chores, id); c.who = c.who === 'me' ? 'partner' : 'me'; }); return;
    case 'choredel': if (busyTmp(id)) return; mutate('chore.delete', {id}, s => { s.chores = s.chores.filter(c => c.id !== id); }); return;
    case 'choreadd': { const t = val('chT'), w = val('chW'), f = val('chF'); if (!t) { toast('Напиши название дела'); return; } mutate('chore.add', {title: t, who: w, freq: f}, s => s.chores.push({id: tmpId(), title: t, who: w === 'partner' ? 'partner' : 'me', freq: f, done_on: null}), 'Дело добавлено'); return; }
    case 'choresplit': act('chore.split', {}, 'Дела поделены поровну'); return;
    case 'mon': { const [Y, M] = ui.calM.split('-').map(Number); ui.calM = ymd(new Date(Y, M - 1 + Number(id), 1)).slice(0, 7); render(); return; }
    case 'sel': ui.sel = id; if (id.slice(0, 7) !== ui.calM) ui.calM = id.slice(0, 7); render(); return;
    case 'planadd': { const t = val('plT'), tm = val('plTime'), day = ui.sel; if (!t) { toast('Напиши, что планируете'); return; } mutate('plan.add', {day, time: tm, title: t}, s => s.plans.push({id: tmpId(), day, time: tm || null, title: t}), 'План добавлен на ' + fmtShort(day)); return; }
    case 'plandel': if (busyTmp(id)) return; mutate('plan.delete', {id}, s => { s.plans = s.plans.filter(p => p.id !== id); }); return;
    case 'bdadd': { const n = val('bdN'), d = val('bdD'); if (!n || !d) { toast('Нужны имя и дата'); return; } mutate('bday.add', {name: n, bdate: d}, s => s.birthdays.push({id: tmpId(), name: n, bdate: d}), 'Добавлено: ' + n); return; }
    case 'bddel': if (busyTmp(id)) return; mutate('bday.delete', {id}, s => { s.birthdays = s.birthdays.filter(x => x.id !== id); }); return;
    case 'spin': spin(); return;
    case 'goplan': if (ui.spin) { const t = 'Идём: ' + ui.spin; mutate('plan.add', {day: today(), title: t}, s => s.plans.push({id: tmpId(), day: today(), time: null, title: t}), 'Записано в календарь на сегодня'); } return;
    case 'placeadd': { const t = val('plIn'); if (!t) return; mutate('place.add', {title: t}, s => s.places.push({id: tmpId(), title: t})); return; }
    case 'placedel': if (busyTmp(id)) return; mutate('place.delete', {id}, s => { s.places = s.places.filter(p => p.id !== id); }); return;
    case 'settings': ui.leaveArm = false; ui.sGender = undefined; openSettings(); return;
    case 'sclose': closeSheet(); return;
    case 'ssave': {
      const nEl = document.getElementById('sNotify');
      const payload = {my_name: val('sMe'), pet_name: val('sPet')};
      if (document.getElementById('sStart')) payload.start_date = val('sStart');
      if (nEl && nEl.checked !== (S.me.notify !== false)) payload.notify = nEl.checked;
      if (ui.sGender !== undefined && ui.sGender !== S.me.gender) payload.gender = ui.sGender;
      if (await act('couple.update', payload, 'Сохранено')) closeSheet();
      return;
    }
    case 'leave':
      if (!ui.leaveArm) { ui.leaveArm = true; b.textContent = leaveWarn(); return; }
      ui.leaveArm = false; closeSheet();
      if (await act('couple.leave', {}, solo() ? 'Всё удалено, можно начать заново' : gw('Ты вышел из пары', 'Ты вышла из пары', 'Ты вышел(а) из пары'))) { ui.onb = 'start'; render(); }
      return;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'tFact') { const w = document.getElementById('tWarn'); if (w) w.hidden = !BLAME.test(e.target.value); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const id = e.target.id;
  if (id === 'shopIn' || id === 'shopQ') { e.preventDefault(); document.querySelector(`[data-act="shopadd"][data-id="${id}"]`).click(); return; }
  if (id === 'talkText') { e.preventDefault(); const t = document.querySelectorAll('.sosp .btn.peach'); t.length && t[t.length - 1].click(); return; }
  if (id === 'sosText') { e.preventDefault(); const t = document.querySelector('.sosp .btn.peach'); t && t.click(); return; }
  if (id === 'thText') return;
  const map = {plIn:'placeadd', chT:'choreadd', plT:'planadd', bdN:'bdadd', wT:'wishadd', oCode:'onbJoin', dT:'dateadd'}[id];
  if (map) { e.preventDefault(); const t = document.querySelector(`[data-act="${map}"]`); t && t.click(); }
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TABS.includes(h) && h !== tab && S && S.couple) { tab = h; render(); } });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { clearTimeout(tapTimer); flushTaps(true); }
  else refresh();
});
setInterval(ping, 15000);

/* ---------- boot ---------- */
async function boot() {
  if (!tg || !tg.initData) { ui.view = 'notg'; render(); return; }
  try {
    tg.ready(); tg.expand();
    tg.setHeaderColor && tg.setHeaderColor('#1f1d38');
    tg.setBackgroundColor && tg.setBackgroundColor('#ffffff');
    tg.setBottomBarColor && tg.setBottomBarColor('#ffffff');
    tg.disableVerticalSwipes && tg.disableVerticalSwipes();
  } catch (e) {}
  const join = new URLSearchParams(location.search).get('join') || '';
  try {
    S = await api('me', {code: join});
    ui.view = 'app';
    ui.missed = S.missed || 0;
    if (S.joinError) toast(S.joinError);
    else if (join && S.couple && S.partner) { toast('Вы теперь пара!'); askWrite(); }
  } catch (e) { ui.view = 'error'; ui.err = e.message; }
  render();
}
render();
boot();
})();
</script>
</body>
</html>
